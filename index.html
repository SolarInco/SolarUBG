<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarUBG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="homepage" class="page">
        <div class="homepage-container">
            <div class="logo-section">
                <span class="sun-emoji">☀</span>
                <h1 class="title">SolarUBG</h1>
            </div>
            <p class="start-text">Click to start</p>
        </div>
    </div>

    <div id="loading" class="page hidden">
        <div class="loading-container">
            <div class="loading-sun">☀</div>
            <p class="loading-text">Loading...</p>
        </div>
    </div>

    <div id="games" class="page hidden">
        <div class="games-container">
            <div class="games-header">
                <button class="back-button">← Back</button>
                <h2 class="games-title">SolarGames</h2>
                <div class="back-button-spacer"></div>
            </div>
            <div class="games-divider"></div>
            <div class="games-content">
                <p class="no-games">No games right now.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
